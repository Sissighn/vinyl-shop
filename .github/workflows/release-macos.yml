name: Release macOS

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify release version
        run: npm run release:check -- "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      - name: Check project
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build Apple Silicon DMG
        run: npm run desktop:package:release
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify disk image and checksum
        working-directory: release
        run: |
          hdiutil verify "Vinyl-Room-${GITHUB_REF_NAME#v}-arm64.dmg"
          shasum -a 256 "Vinyl-Room-${GITHUB_REF_NAME#v}-arm64.dmg" > "Vinyl-Room-${GITHUB_REF_NAME#v}-arm64.dmg.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/Vinyl-Room-${GITHUB_REF_NAME#v}-arm64.dmg" \
            "release/Vinyl-Room-${GITHUB_REF_NAME#v}-arm64.dmg.sha256" \
            --verify-tag \
            --title "Vinyl Room $GITHUB_REF_NAME" \
            --notes-file release/RELEASE_NOTES.md
