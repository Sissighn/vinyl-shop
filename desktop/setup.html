<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up Vinyl Room</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 80% 10%, #65332c, transparent 42%), #261b1b; color: #f4e9df; }
    main { max-width: 480px; margin: auto; padding: 50px 42px 38px; }
    .mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: #382523; box-shadow: 0 8px 26px #140c0b55; }
    .mark::before { content: ""; display: block; width: 31px; height: 31px; border-radius: 50%; background: radial-gradient(circle, #f4dfc8 0 2px, #c47250 3px 7px, #171414 8px 14px, #ba8c70 15px); }
    .eyebrow { margin-top: 34px; color: #d49d7c; font-size: 10px; font-weight: 700; letter-spacing: .22em; }
    h1 { margin: 11px 0 12px; font: 35px/1.1 Georgia, serif; font-weight: 400; }
    p { color: #d5c5b9; font-size: 13px; line-height: 1.65; }
    ol { margin: 22px 0; padding-left: 18px; color: #e4d4c7; font-size: 12px; line-height: 1.8; }
    code { display: inline-block; margin-top: 4px; padding: 5px 7px; border-radius: 5px; background: #170f0e; color: #f1bd97; font-size: 11px; user-select: all; }
    label { display: block; margin: 20px 0 7px; color: #d7a98a; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    input { width: 100%; height: 44px; padding: 0 13px; border: 1px solid #7b594a; border-radius: 7px; outline: 0; background: #1e1615; color: #fff3e8; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    input:focus { border-color: #d49d7c; box-shadow: 0 0 0 3px #d49d7c33; }
    button { border: 0; cursor: pointer; }
    .primary { width: 100%; height: 44px; margin-top: 15px; border-radius: 7px; background: #cc8463; color: #201410; font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .primary:hover { background: #e0a17e; }
    .skip { display: block; margin: 10px auto 0; padding: 8px; color: #d7c3b4; background: transparent; font-size: 11px; }
    .skip:hover { color: #fff0e1; }
    .link { padding: 0; background: none; color: #f0ad84; font: inherit; text-decoration: underline; text-underline-offset: 3px; }
    .error { min-height: 21px; color: #ffb9a7; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <div class="eyebrow">ONE-TIME SETUP</div>
    <h1>Welcome to Vinyl Room.</h1>
    <p>Connect your own Spotify developer app to fill the wall with your favorite albums. No secret is stored inside Vinyl Room.</p>
    <ol>
      <li><button type="button" class="link" id="dashboard">Create an app in Spotify Developer Dashboard</button>.</li>
      <li>Add this Redirect URI: <code>http://127.0.0.1:17873/api/spotify/callback</code></li>
      <li>Copy the app's Client ID below.</li>
    </ol>
    <form id="setup-form">
      <label for="client-id">Spotify Client ID</label>
      <input id="client-id" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" required placeholder="32-character Client ID">
      <button class="primary" type="submit">Enter the room</button>
      <button class="skip" id="skip" type="button">Explore the room without Spotify</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </main>
  <script>
    const input = document.getElementById("client-id");
    const error = document.getElementById("error");
    window.vinylDesktop.initialClientId().then((id) => { input.value = id; });
    document.getElementById("dashboard").addEventListener("click", () => window.vinylDesktop.openDashboard());
    document.getElementById("skip").addEventListener("click", () => window.vinylDesktop.skipSetup());
    document.getElementById("setup-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      const result = await window.vinylDesktop.saveClientId(input.value);
      if (result.error) error.textContent = result.error;
    });
  </script>
</body>
</html>
